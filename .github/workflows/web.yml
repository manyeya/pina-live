# Pina Live in a browser: built to WebAssembly, its JavaScript made by wasm-bindgen (the version
# Cargo.lock has), and the page (web/: index.html, the icon, the demo songs) published to GitHub
# Pages on every push to main. Run it by hand (Actions, Web, Run workflow) to publish any branch.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Built and uploaded here; published by the next job. (Publishing in the same job looks for the
  # upload before GitHub lists it, and a re-run finds two: GitHub's own template splits them.)
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen, as Cargo.lock has it
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$V" --locked

      - name: Build
        run: |
          cargo build --release --target wasm32-unknown-unknown -p pina-live
          wasm-bindgen --target web --no-typescript --out-dir web/pkg \
            target/wasm32-unknown-unknown/release/pina-live.wasm
          ls -l web web/pkg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
