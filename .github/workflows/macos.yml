# Pina Live for macOS: tested, built for Apple silicon and Intel, and made into its disk image with
# the animated installer on it (signed ad hoc, or with the Developer ID in the PINA_SIGN_ID
# secret), kept with the run; for a release tag vX.Y.Z, put on that tag's release too. Run it by hand (Actions, macOS, Run workflow) for a
# build of any branch.
name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # layouts_fit draws the window with Metal, which the hosted runners don't give a test.
      - name: Test
        run: cargo test --workspace -- --skip layouts_fit

      # The disk image: "Install Pina Live" (the animated installer) with Pina Live inside it,
      # for Apple silicon and Intel, in its window of its own design.
      - name: Make the disk image
        env:
          PINA_SIGN_ID: ${{ secrets.PINA_SIGN_ID }}
        run: scripts/release-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PinaLive-macos
          path: dist/*

      - name: Put it on the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
