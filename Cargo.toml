[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Pina Studio's engine: decoding, song study (tempo, key, form, loudness), its effects and stems.
pina-engine = { git = "https://github.com/manyeya/pina-studio", rev = "26bc9ca2c2ed3f8751ee5a3cf036f9dc0c3ef10e" }

# As Pina Studio: dependencies fast even in dev builds (gpui and DSP can't keep up unoptimized),
# our own code with line numbers only.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
