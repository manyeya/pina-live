[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Manyeya Khutso Siema"]
license = "MIT"
description = "DJ software on Pina Studio's engine, by Manyeya Khutso Siema"
homepage = "https://manyeya.github.io/pina-studio/live/"
repository = "https://github.com/manyeya/pina-live"

[workspace.dependencies]
# Pina Studio's engine: decoding, song study (tempo, key, form, loudness), its effects and stems.
# Without its lyrics (whisper.cpp): Pina Live doesn't hear words, so needn't build it.
pina-engine = { git = "https://github.com/manyeya/pina-studio", rev = "976ae5b0b330935b375963b5b4e564e6969fbd33", default-features = false }

# As Pina Studio: dependencies fast even in dev builds (gpui and DSP can't keep up unoptimized),
# our own code with line numbers only.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
