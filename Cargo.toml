[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Pina Studio's engine: decoding, song study (tempo, key, form, loudness), its effects and stems.
pina-engine = { git = "https://github.com/manyeya/pina-studio", rev = "d1a9ae74bd32e385ccbb5bece137ab5d6a4b1431" }

# As Pina Studio: dependencies fast even in dev builds (gpui and DSP can't keep up unoptimized),
# our own code with line numbers only.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
