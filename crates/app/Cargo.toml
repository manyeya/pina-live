[package]
name = "pina-live"
version.workspace = true
edition.workspace = true

[dependencies]
pina-live-engine = { path = "../engine" }
pina-engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# As Pina Studio: gpui-pre, a weekly crates.io republish of gpui (its git can't be a dependency).
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

# The `shots` test: the window drawn to PNGs by the headless Metal renderer.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["runtime_shaders", "font-kit", "test-support"] }
