[package]
name = "pina-live"
version.workspace = true
edition.workspace = true

[dependencies]
pina-live-engine = { path = "../engine" }
pina-engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The clock: std's natively, the browser's in a web build (std's Instant panics there).
web-time = "1"
# MIDI controllers (Pina Studio's choice too), and their events woken on the UI's thread.
midir = "0.11"
futures = "0.3"
rtrb = "0.3"
# As Pina Studio: gpui-pre, a weekly crates.io republish of gpui (its git can't be a dependency).
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["runtime_shaders", "font-kit"] }

# In a browser: the page's events and files, and its async calls.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "Event", "DragEvent", "DataTransfer", "File", "FileList", "Blob", "HtmlInputElement", "Response"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# examples/icon: the app icon's SVG to PNGs.
resvg = "0.46"

# The `shots` test: the window drawn to PNGs by the headless Metal renderer.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["runtime_shaders", "font-kit", "test-support"] }
